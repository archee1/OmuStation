- type: entity
  name: ore bag of holding
  id: OreBagOfHolding
  parent: OreBagMagnetic # Lavaland Change
  description: A robust bag of holding for salvage billionaires and rich miners alike to carry large amounts of ore. Magnetises any nearby ores when attached to a belt.
  components:
  - type: MagnetPickup
    range: 2
  # Omu changes start
  - type: Sprite
    sprite: Objects/Specific/Mining/ore_bag_holding.rsi
    layers:
      - state: icon
      - state: icon-unshaded
        shader: unshaded
      - state: icon-on-unshaded
        shader: unshaded
        visible: false
        map: [ "enum.ToggleableVisuals.Layer" ]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: { visible: true }
          False: { visible: false }
  - type: Clothing
    sprite: Objects/Specific/Mining/ore_bag_holding.rsi
    quickEquip: false
    slots:
      - belt
    clothingVisuals:
      belt:
        - state: equipped-BELT
        - state: equipped-BELT-unshaded
          shader: unshaded
  - type: Item
    size: Huge
    sprite: Objects/Specific/Mining/ore_bag_holding.rsi
    inhandVisuals:
      left:
        - state: inhand-left
        - state: inhand-left-unshaded
          shader: unshaded
      right:
        - state: inhand-right
        - state: inhand-right-unshaded
          shader: unshaded
  # Omu changes end
  - type: Storage
    grid:
    - 0,0,19,9
  - type: PhysicalComposition #Goobstation - Recycle update
    materialComposition:
      Steel: 500
      Silver: 187
      Plasma: 375
      Uranium: 37
      BSCrystal: 25
