- type: entity
  name: high-capacity ore bag
  description: A robust bag for salvage specialists and miners alike to carry large amounts of ore. Magnetises any nearby ores when attached to a belt.
  id: OreBagMagnetic
  parent: OreBag
  components:
  # Omu changes start
  - type: Sprite
    sprite: _Omu/Objects/Specific/Mining/big-ore_bag.rsi
    layers:
      - state: icon
      - state: icon-on-unshaded
        shader: unshaded
        visible: false
        map: [ "enum.ToggleableVisuals.Layer" ]
  - type: Clothing
    sprite: _Omu/Objects/Specific/Mining/big-ore_bag.rsi # Omu
    quickEquip: false
    slots:
    - belt
  - type: Item
    size: Ginormous
    sprite: _Omu/Objects/Specific/Mining/big-ore_bag.rsi
    inhandVisuals:
      left:
      - state: inhand-left
      right:
      - state: inhand-right
  # Omu changes end
  - type: MagnetPickup # Lavaland TODO: rewrite this component's logic when porting to Reforged
    range: 1.5
  - type: ItemToggle
    soundActivate:
      collection: sparks
      params:
        variation: 0.250
    soundDeactivate:
      collection: sparks
      params:
        variation: 0.250
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: { visible: true } # Omu
          False: { visible: false } # Omu
  - type: Storage
    grid:
    - 0,0,9,7
