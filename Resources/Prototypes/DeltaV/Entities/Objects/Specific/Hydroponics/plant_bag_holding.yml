  - type: Item
    size: Huge
    inhandVisuals:
      left:
        - state: inhand-left
        - state: inhand-left-unshaded
          shader: unshaded
      right:
        - state: inhand-right
        - state: inhand-right-unshaded
          shader: unshaded
  # Omu changes end
  - type: Storage
    grid:
    - 0,0,19,9
