- type: entity
  name: plant bag of holding
  id: PlantBagOfHolding
  parent: PlantBag
  description: A robust bag of holding for fruitful botanists with more plants than pockets.
  components:
  # Omu changes start
  - type: Sprite
    sprite: DeltaV/Objects/Specific/Hydroponics/plant_bag_holding.rsi
